name: CI — build and quality checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  editor:
    name: Build notes editor and audit dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notes_editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes_editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci

      - name: Build editor bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Android build, tests, lint, and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Accept SDK licenses & install platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=3 \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            > /dev/null 2>&1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Check Java formatting
        run: ./gradlew :app:spotlessCheck --no-daemon --stacktrace
