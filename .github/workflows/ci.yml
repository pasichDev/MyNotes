name: CI — build and quality checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  editor:
    name: Build notes editor and audit dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notes_editor

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes_editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci

      - name: Build editor bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Android build, tests, lint, and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android platform
        run: |
          sdkmanager \
            --channel=3 \
            "platforms;android-37.2" \
            "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Kept out of the repository and injected here. A fork or a pull request from a fork
          # gets no secrets, and the build is deliberately able to run without the file: sign-in
          # and Drive sync are simply disabled in that case.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "google-services.json restored from the repository secret."
          else
            echo "GOOGLE_SERVICES_JSON is not available; building without Firebase."
          fi

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Compile release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Run unit tests and generate coverage
        run: ./gradlew :app:test :app:createDebugUnitTestCoverageReport --no-daemon --stacktrace

      - name: Upload debug unit-test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-unit-test-coverage
          path: app/build/reports/coverage/
          if-no-files-found: error

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Check Java formatting
        run: ./gradlew :app:spotlessCheck --no-daemon --stacktrace

  instrumentation:
    name: Android instrumentation and Room migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Run sync integration and migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
