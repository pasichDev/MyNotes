plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.diffplug.spotless'
}

// app/google-services.json is gitignored, so a fresh clone or a CI job does not have it. The
// google-services plugin aborts the build when the file is missing, so it is applied only when
// the configuration is actually present.
def googleServicesConfig = file("google-services.json")
def hasGoogleServices = googleServicesConfig.exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("google-services.json not found: Google sign-in and Drive sync are disabled in this build.")
}

apply plugin: 'com.android.application'
apply plugin: 'com.google.dagger.hilt.android'
apply from: "$projectDir/gradle/libs-task.gradle"
apply from: "$projectDir/gradle/changelog-task.gradle"


def appVersionCode = 53
def appVersionName = "2.6.${appVersionCode}"

def gitCommitHashProvider = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }

ext.gitCommitHash = gitCommitHashProvider

// build changelog && libs
preBuild.dependsOn(generateLibsJson)
preBuild.dependsOn(copyChangelog)


android {
    compileSdkVersion 37
    sourceSets {
        androidTest {
            // MigrationTestHelper loads exported Room schemas from test APK assets.
            assets.srcDirs += "$projectDir/schemas"
        }
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
    defaultConfig {
        applicationId "com.pasich.mynotes"
        minSdkVersion 26
        targetSdkVersion 37

        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        resValue "string", "whatNewVersion", "\"🔥 v${versionName}\""
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitCommitHashProvider.get()}\""

        // Normally generated by the google-services plugin. The empty fallback keeps a build
        // without google-services.json compilable; sign-in then reports that it is unavailable.
        if (!hasGoogleServices) {
            resValue "string", "default_web_client_id", ""
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath) {
                storeFile     file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : null
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            enableUnitTestCoverage true
            // The Room store, the DAOs and the preference adapters are only reachable on a
            // device, so without this they report 0% and the PR comment understates what is
            // actually tested.
            enableAndroidTestCoverage true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    hilt {
        enableAggregatingTask = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'com.pasich.mynotes'
    lint {
        abortOnError true
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

// Fix for Windows PATH with embedded quotes breaking java.library.path in test JVM
// The Gradle worker JVM command is built by DefaultWorkerProcessBuilder which reads
// java.library.path from the daemon JVM. We sanitize it by replacing the system property.
def rawLibPath = System.getProperty("java.library.path") ?: ""
def cleanLibPath = rawLibPath.split(File.pathSeparator).findAll { !it.contains('"') }.join(File.pathSeparator)
System.setProperty("java.library.path", cleanLibPath)

tasks.withType(Test).configureEach {
    def jniDebug = "${project.projectDir}/src/testDebug/jniLibs"
    def jniTest  = "${project.projectDir}/src/test/jniLibs"
    jvmArgs "-Djava.library.path=${jniDebug}${File.pathSeparator}${jniTest}"
}

// Only execute in the release build
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(":app:assembleRelease") ||
            graph.hasTask(":app:bundleRelease")) {

        preBuild.dependsOn(generateLibsJson)
        preBuild.dependsOn(copyChangelog)
    }
}

ext {
    markwon_version = '4.6.2'
    roomVersion = '2.8.4'
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.work:work-runtime:2.10.1'

    // Google Credential Manager (authentication only; Drive authorization is requested separately)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    //DI (Hilt)
    implementation "com.google.dagger:hilt-android:$daggerHilt"
    annotationProcessor "com.google.dagger:hilt-compiler:$daggerHilt"

    //Reactive
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //Room
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"

    //Pay Billing
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.android.billingclient:billing:8.3.0'

    //Other lib (Gson/PhotoView)
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    //Markwon https://noties.io/Markwon/docs/v4/
    implementation"io.noties.markwon:core:$markwon_version"
    implementation"io.noties.markwon:ext-strikethrough:$markwon_version"
    implementation"io.noties.markwon:linkify:$markwon_version"

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'com.google.truth:truth:1.4.2'

    // Room testing (integration tests)
    testImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation 'org.mockito:mockito-android:5.23.0'
    androidTestImplementation 'com.google.truth:truth:1.4.5'

}

// Room 2.8.x migration tooling mixes serialization 1.7.x BOM constraints with its
// 1.8.x generated serializers. Keep the runtime family aligned or Android migration
// tests fail with AbstractMethodError at runtime.
configurations.configureEach {
    resolutionStrategy.force(
            'org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1')
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp()   // 4-space indent (AOSP style)
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named("spotlessJava").configure {
    dependsOn generateLibsJson
    dependsOn copyChangelog
}

tasks.named("spotlessJavaCheck").configure {
    dependsOn generateLibsJson
    dependsOn copyChangelog
}
