buildscript {
    ext {
        daggerHilt = '2.60.1'
    }

    repositories {
        google()
        mavenCentral()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "com.google.dagger:hilt-android-gradle-plugin:$daggerHilt"
    }

}
plugins {
    id 'com.google.dagger.hilt.android' version "$daggerHilt" apply false
    id 'com.diffplug.spotless' version '8.11.0' apply false
    id 'com.google.gms.google-services' version '4.6.0' apply false
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

